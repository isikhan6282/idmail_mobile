workflows:
  ios-workflow:
    name: IDmail iOS Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS App (Ad-hoc / Release)
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa